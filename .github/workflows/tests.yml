name: Independent security workflow
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
      STREAMLIT_SERVER_FILE_WATCHER_TYPE: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -q
  real-parser:
    runs-on: ubuntu-latest
    env:
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
      STREAMLIT_SERVER_FILE_WATCHER_TYPE: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: sudo apt-get update
      - run: sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: tshark --version
      - run: python -m unittest discover -s team_tests -v
      - run: python -m pytest -q
      - run: python integration_demo.py --output runtime/ci-rehearsal
        env:
          PCAP_VAULT_PASSWORD: CI-only-synthetic-demo-passphrase!
